version: "3.9"

services:
  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  server:
    build:
      context: ./server
    environment:
      MONGO_URI: mongodb://mongodb:27017/expenseiq
      MONGO_DB_NAME: expenseiq
      SECRET_KEY: change-me
      JWT_SECRET_KEY: change-me-too
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "5000:5000"
    depends_on:
      - mongodb

  client:
    build:
      context: ./client
    ports:
      - "5173:80"
    depends_on:
      - server

volumes:
  mongo_data:
